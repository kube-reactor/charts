{{- define "reactor.prometheusRule" -}}
{{- $root := (index . 0) -}}
{{- $service := (index . 1) -}}
{{- $prometheusRules := ($service.prometheusRules | default (dict )) -}}
{{- if $prometheusRules }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
{{- $name := include "reactor.serviceName" (list $root $service "") }}
{{ include "reactor.metadata" (list $root $service $name) }}
spec:
  groups:
    - name: {{ $name | quote}}
      rules: {{- include "reactor.util.tplvalues.render" ( dict "value" $prometheusRules "context" $root ) | nindent 6 }}
{{- end }}
{{- end }}
