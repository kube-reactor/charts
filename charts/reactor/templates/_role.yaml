{{/*
Generate cluster or namespace role binding
*/}}
{{- define "reactor.role" -}}
{{- $root := (index . 0) -}}
{{- $role := (index . 1) -}}
{{- $name := (index . 2) -}}
{{- if $role }}
---
kind: {{ if $role.global -}}ClusterRole{{- else -}}Role{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
{{- $name := include "reactor.serviceName" (list $root nil $name) }}
{{ include "reactor.metadata" (list $root nil $name) }}
rules:
{{- range $policy := $role.rules }}
  - apiGroups: {{ include "reactor.util.ensureList" ($policy.apiGroups | default "") | nindent 6 }}
    nonResourceURLs: {{ include "reactor.util.ensureList" $policy.nonResourceURLs | nindent 6 }}
    resourceNames: {{ include "reactor.util.ensureList" $policy.resourceNames | nindent 6 }}
    resources: {{ include "reactor.util.ensureList" $policy.resources | nindent 6 }}
    verbs: {{ include "reactor.util.ensureList" $policy.verbs | nindent 6 }}
{{ end -}}
{{- end -}}
{{- end -}}
