{{- define "reactor.prometheusRule" -}}
{{- $root := (index . 0) -}}
{{- $service := (index . 1) -}}
{{- $serviceMonitor := ($service.serviceMonitor | default (dict )) -}}
{{- if $serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
{{- $name := include "reactor.serviceName" (list $root $service "") }}
{{ include "reactor.metadata" (list $root $service $name) }}
spec:
  jobLabel: {{ $serviceMonitor.jobLabel | quote }}
  selector:
    matchLabels: {{- include "common.labels.matchLabels" ( dict "customLabels" .Values.commonLabels "context" $root ) | nindent 6 }}
      {{- if $serviceMonitor.selector }}
      {{- include "reactor.util.tplvalues.render" (dict "value" $serviceMonitor.selector "context" $root) | nindent 6 }}
      {{- end }}
  endpoints:
    - port: metrics
      path: /metrics
      {{- if $serviceMonitor.interval }}
      interval: {{ $serviceMonitor.interval }}
      {{- end }}
      {{- if $serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ $serviceMonitor.scrapeTimeout }}
      {{- end }}
      {{- if $serviceMonitor.honorLabels }}
      honorLabels: {{ $serviceMonitor.honorLabels }}
      {{- end }}
      {{- if $serviceMonitor.relabelings }}
      relabelings: {{- include "reactor.util.tplvalues.render" ( dict "value" $serviceMonitor.relabelings "context" $root ) | nindent 8 }}
      {{- end }}
      {{- if $serviceMonitor.metricRelabelings }}
      metricRelabelings: {{- include "reactor.util.tplvalues.render" ( dict "value" $serviceMonitor.metricRelabelings "context" $root ) | nindent 8 }}
      {{- end }}
  namespaceSelector:
    matchNames:
      - {{ $root.Release.Namespace }}
{{- end }}
{{- end }}