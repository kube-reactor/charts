{{/*
Generate a service account
*/}}
{{- define "reactor.serviceAccount" -}}
{{- $root := (index . 0) -}}
{{- $service := (index . 1) -}}
{{- $name := (index . 2) }}
---
apiVersion: v1
kind: ServiceAccount
{{- $name := include "reactor.serviceName" (list $root $service $name) }}
{{ include "reactor.metadata" (list $root $service $name) }}
{{- end -}}
