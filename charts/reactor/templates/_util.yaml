{{- /*
reactor.util.merge will merge two YAML templates and output the result.
This takes an array of three values:
- the root context
- the template name of the overrides (destination)
- the template name of the base (source)
*/}}
{{- define "reactor.util.merge" -}}
{{- $root := first . -}}
{{- $overrides := fromYaml (include (index . 1) $root) | default (dict ) -}}
{{- $tpl := fromYaml (include (index . 2) $root) | default (dict ) -}}
{{- toYaml (merge $overrides $tpl) -}}
{{- end -}}

{{- /*
reactor.util.ensureList will ensure the input is rendered as a list.
This takes a single value:
- the data item
*/}}
{{- define "reactor.util.ensureList" -}}
{{- if and . (kindIs "slice" .) -}}
{{- toYaml . -}}
{{- else -}}
{{- toYaml (ternary (list ) (list .) (kindIs "invalid" .)) -}}
{{- end -}}
{{- end -}}

{{/*
Renders a value that contains template perhaps with scope if the scope is present.
Usage:
{{ include "reactor.util.tplvalues.render" ( dict "value" .Values.path.to.the.Value "context" $ ) }}
*/}}
{{- define "reactor.util.tplvalues.render" -}}
{{- $value := typeIs "string" .value | ternary .value (.value | toYaml) }}
{{- if contains "{{" (toJson .value) }}
  {{- tpl $value .context }}
{{- else }}
  {{- $value | nindent 6 }}
{{- end }}
{{- end }}